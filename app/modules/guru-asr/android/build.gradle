plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.guruasr'
version = '0.1.0'

android {
  namespace "expo.modules.guruasr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Pinned to the Python onnxruntime that exported and checked the model (tools/stt_bench/phone_model.py).
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.32.0"
}
