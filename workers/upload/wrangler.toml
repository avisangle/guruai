name = "guru-upload"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ACCOUNT_ID = ""
BUCKET = "guru-uploads"

# Set with `wrangler secret put`.
[secrets]
required = ["APP_KEY", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY"]

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "guru-uploads"

# 30 requests a minute per device_id.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
